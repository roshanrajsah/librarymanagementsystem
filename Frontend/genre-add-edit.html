<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Genre · LibraryHub</title>
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body data-page="genres">
    <div class="layout">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main">
            <header class="page-heading">
                <div>
                    <h1 id="formTitle">Add genre</h1>
                    <p>Create a category for your books.</p>
                </div>
            </header>
            <form id="genreForm" class="card form-card form-grid">
                <div class="field full"><label>Name</label><input id="name" required></div>
                <div class="field full"><label>Description</label><textarea id="description"
                        placeholder="What kinds of books belong here?"></textarea></div>
                <div class="field full form-actions"><a class="button secondary" href="genres.html">Cancel</a><button
                        class="button">Save genre</button></div>
            </form>
        </main>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/genre-form.js"></script>
</body>

</html>
