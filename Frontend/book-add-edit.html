<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Book · LibraryHub</title>
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body data-page="book-add-edit">
    <div class="layout">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main">
            <header class="page-heading">
                <div>
                    <h1 id="formTitle">Add book</h1>
                    <p>Add a book and link it to an author and genre.</p>
                </div>
            </header>
            <form id="bookForm" class="card form-card form-grid">
                <div class="field full"><label>Title</label><input id="title" name="title" required></div>
                <div class="field"><label>Author</label><select id="authorId" name="authorId" required></select></div>
                <div class="field"><label>Genre</label><select id="genreId" name="genreId" required></select></div>
                <div class="field"><label>Stock</label><input id="stock" name="stock" type="number" min="0" value="0"
                        required></div>
                <div class="field"><label>Cover image</label><input name="coverImage" type="file" accept="image/*">
                </div>
                <div class="field full form-actions"><a class="button secondary" href="/books">Cancel</a><button
                        id="saveButton" class="button">Save book</button></div>
            </form>
        </main>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/book-form.js"></script>
</body>

</html>
