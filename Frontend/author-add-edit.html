<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Author · LibraryHub</title>
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body data-page="authors">
    <div class="layout">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main">
            <header class="page-heading">
                <div>
                    <h1 id="formTitle">Add author</h1>
                    <p>Add a writer to use in your books.</p>
                </div>
            </header>
            <form id="authorForm" class="card form-card form-grid">
                <div class="field full"><label>Name</label><input id="name" required></div>
                <div class="field full"><label>Biography</label><textarea id="bio"
                        placeholder="A short introduction..."></textarea></div>
                <div class="field full form-actions"><a class="button secondary" href="authors.html">Cancel</a><button
                        class="button">Save author</button></div>
            </form>
        </main>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/author-form.js"></script>
</body>

</html>
