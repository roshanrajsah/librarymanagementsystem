<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard · LibraryHub</title>
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body data-page="dashboard">
    <div class="layout">
        <aside id="sidebar" class="sidebar"></aside>
        <main class="main">
            <header class="page-heading">
                <div>
                    <h1>Dashboard</h1>
                    <p>See what is happening across your library.</p>
                </div><a class="button" href="book-add-edit.html">Add book</a>
            </header>
            <section class="grid">
                <article class="card stat"><small>TOTAL BOOKS</small><strong id="bookCount">—</strong></article>
                <article class="card stat"><small>AUTHORS</small><strong id="authorCount">—</strong></article>
                <article class="card stat"><small>GENRES</small><strong id="genreCount">—</strong></article>
            </section>
            <section class="card" style="margin-top:20px">
                <div class="page-heading">
                    <div>
                        <h1 style="font-size:18px">Recent books</h1>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Genre</th>
                            <th>Stock</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="recentBooks"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>

</html>
