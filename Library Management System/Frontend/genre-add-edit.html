<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS - Add / Edit Genre</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f8fafc; display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: #1e293b; color: white; display: flex; flex-direction: column; min-height: 100vh; }
    .brand { padding: 24px; font-size: 1.2rem; font-weight: bold; color: #818cf8; border-bottom: 1px solid #334155; }
    .menu { list-style: none; padding: 20px 0; flex: 1; }
    .menu a { display: block; padding: 12px 24px; color: #94a3b8; text-decoration: none; font-weight: 500; }
    .menu a:hover, .menu a.active { background: #334155; color: white; border-left: 4px solid #4f46e5; }
    .main { flex: 1; padding: 32px; }
    .header { margin-bottom: 24px; }
    .card { background: white; padding: 28px; border-radius: 10px; border: 1px solid #e2e8f0; max-width: 500px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.95rem; }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
    .btn { background: #4f46e5; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">📚 LMS Portal</div>
    <ul class="menu">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="books.html">Book List</a></li>
      <li><a href="book-add-edit.html">Add Book</a></li>
      <li><a href="authors.html">Authors</a></li>
      <li><a href="genres.html" class="active">Genres</a></li>
      <li><a href="profile.html">My Profile</a></li>
      <li><a href="#" id="logout" style="color: #f87171;">Logout</a></li>
    </ul>
  </div>

  <div class="main">
    <div class="header">
      <h2>Add / Edit Genre</h2>
    </div>

    <div class="card">
      <form id="genreForm">
        <div class="form-group">
          <label>Genre Name *</label>
          <input type="text" placeholder="e.g. Science Fiction" required>
        </div>

        <button type="submit" class="btn">Save Genre</button>
      </form>
    </div>
  </div>

  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'login.html';
    document.getElementById('logout').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('isLoggedIn');
      window.location.href = 'login.html';
    });

    document.getElementById('genreForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Genre saved!');
      window.location.href = 'genres.html';
    });
  </script>
</body>
</html>
