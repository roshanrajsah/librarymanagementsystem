<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LibraryHub · Sign in</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <style>
        body {
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #182238, #4f46e5);
            min-height: 100vh
        }

        .login {
            width: min(430px, calc(100% - 32px));
            padding: 34px
        }

        .login h1 {
            margin: 0
        }

        .login p {
            color: var(--muted);
            margin: 6px 0 24px
        }
    </style>
</head>

<body data-page="login">
    <main class="card login"><a class="brand" style="color:var(--ink);padding:0" href="/">Library<span>Hub</span></a>
        <h1>Welcome back</h1>
        <p>Sign in to manage your collection.</p>
        <form id="loginForm" class="form-grid">
            <div class="field full"><label>Username</label><input id="username" required value="admin"></div>
            <div class="field full"><label>Password</label><input id="password" type="password" required
                    value="admin123"></div>
            <div class="field full"><button class="button" style="width:100%">Sign in</button></div>
        </form>
    </main>
    <script src="assets/js/login.js"></script>
</body>

</html>
